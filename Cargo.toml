[package]

name = "git-global"
version = "0.8.0"
authors = ["Eric Petersen <eric@ericpetersen.io>"]
description = "Keep track of all the git repositories on your machine."

repository = "https://github.com/peap/git-global"
documentation = "https://docs.rs/git-global"

license = "MIT"
readme = "README.md"

keywords = ["git"]
categories = ["command-line-utilities", "development-tools", "filesystem"]

edition = "2024"

default-run = "git-global"

[[bin]]
name = "git-global"
path = "src/main.rs"
doc = false


[dependencies]
clap_mangen = "0.3"
directories = "6"
git2 = "0.21"
num_cpus = "1"
serde_json = "1"
tempfile = "3"
termsize = "0.1"
walkdir = "2"

[dev-dependencies]
regex = "1"

[dependencies.clap]
version = "4"
features = ["cargo"]

[dependencies.serde]
version = "1"
features = ["derive"]
